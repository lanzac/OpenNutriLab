[project]
name = "opennutrilab"
version = "0.1.0"
description = "An open-source app for precise food and meal analysis"
authors = [{ name = "Andre Lanrezac", email = "a.lanrezac@gmail.com" }]
requires-python = "==3.13.*"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "django (>=5.2.3,<6.0.0)",
    "django-vanilla-views (>=3.0.0,<4.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "pillow (>=11.2.1,<12.0.0)",
    "django-environ (>=0.12.0,<0.13.0)",
    "django-ninja (>=1.4.3,<2.0.0)",
    "crispy-bootstrap5 (>=2025.6,<2026.0)",
    "uvicorn>=0.35.0",
    "whitenoise>=6.9.0",
    "django-vite>=3.0.0",
    "django-cors-headers>=4.7.0",
    "django-allauth[mfa]>=65.11.1",
    "argon2-cffi>=25.1.0",
    "django-redis>=6.0.0",
    "hiredis>=3.2.1",
    "redis>=6.4.0",
    "psycopg[binary]>=3.2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "django-types>=0.22.0,<0.23",
    "coverage>=7.10.3,<8",
    "pytest>=8.4.1,<9",
    "pytest-django>=4.11.1,<5",
    "django-extensions>=4.1",
    "django-debug-toolbar>=6.0.0",
    # Attached from VS Code (.vscode/launch.json); config/asgi.py only starts it
    # when DEBUG is on, so the production image never needs it.
    "debugpy>=1.8.14,<2.0.0",
    "basedpyright>=1.31.3",
    "pytest-sugar>=1.1.0",
    "django-stubs-ext>=5.2.2",
    "watchfiles>=1.1.0",
    "pre-commit>=4.3.0",
    # Pinned to the revs in .pre-commit-config.yaml, so the editor (which runs
    # them from this virtualenv, see .devcontainer/devcontainer.json) and the
    # hooks never disagree. Bump both places together.
    "djlint==1.36.4",
    "ruff==0.13.1",
    "factory-boy>=3.3.3",
    # Browser-driven verification. Not used by the pytest suite: it is the only
    # way to see console output, uncaught JS errors and what actually renders,
    # which is how the "@vitejs/plugin-react can't detect preamble" failure that
    # kept React from mounting was found. Declared here because it was silently
    # removed three times in one session - once by a container rebuild, twice by
    # uv sync. The browser binaries are not a Python dependency; see
    # .devcontainer/devcontainer.json and `just playwright`.
    "playwright>=1.55.0",
]

# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
# --ds rather than a DJANGO_SETTINGS_MODULE key: the command-line option wins
# over a DJANGO_SETTINGS_MODULE exported in the shell, so the suite always
# runs against the test settings.
addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib"
python_files = ["test_*.py"]

# ==== Coverage ====
[tool.coverage.run]
source = ["opennutrilab"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    # Framework glue with no logic of its own to test.
    "opennutrilab/users/adapters.py",
    "opennutrilab/products/admin.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

# ==== basedpyright ====
[tool.basedpyright]
# Target Python version (requires-python above)
pythonVersion = "3.13"

# Strict where the project's own logic lives, basic elsewhere: config/ and
# opennutrilab/ are mostly framework glue generated by cookiecutter, where
# strict mode mostly reports untyped third-party APIs.
typeCheckingMode = "basic"
strict = ["opennutrilab/products"]

# Use installed libraries' code for type inference (helpful with django-stubs, etc.)
useLibraryCodeForTypes = true

# Missing imports handling (equivalent to mypy ignore_missing_imports)
reportMissingImports = false
reportMissingTypeStubs = false

# Optional type checks (null/None-related issues)
reportOptionalMemberAccess = true
reportOptionalCall = true
reportOptionalSubscript = true
reportOptionalIterable = true
reportOptionalOperand = true

# General diagnostics
reportUnboundVariable = true
reportUndefinedVariable = true
reportUnusedImport = false    # Set to true if you want to detect unused imports
reportUnusedVariable = false  # Set to true if you want to detect unused variables

# Analysed for imports but never reported on. typings/ holds type stubs for
# untyped dependencies (see typings/environ).
ignore = ["**/migrations/**", "**/node_modules/**", ".venv/**", "typings/**"]

# Libraries that ship no type information. Without this, strict mode on
# products/ reports every import from them. crispy-forms and vanilla-views
# leave with the server-rendered product form.
allowedUntypedLibraries = ["crispy_forms", "crispy_bootstrap5", "vanilla", "allauth", "factory"]



# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2


[tool.ruff]
target-version = "py313"
# Exclude a variety of commonly ignored directories.
extend-exclude = [
    "*/migrations/*.py",
    "staticfiles/*",
    # Type stubs for untyped dependencies: they mirror those libraries' APIs.
    "typings/*",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "UP",
    "YTT",
    # "ANN", # flake8-annotations: we should support this in the future but 100+ errors atm
    "ASYNC",
    "S",
    "BLE",
    "FBT",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "DJ",
    "EM",
    "EXE",
    "FA",
    'ISC',
    "ICN",
    "G",
    'INP',
    'PIE',
    "T20",
    'PYI',
    'PT',
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SLOT",
    "SIM",
    "TID",
    "TC",
    "INT",
    # "ARG", # Unused function argument
    "PTH",
    "ERA",
    "PD",
    "PGH",
    "PL",
    "TRY",
    "FLY",
    # "NPY",
    # "AIR",
    "PERF",
    # "FURB",
    # "LOG",
    "RUF",
]
ignore = [
    "S101", # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "SIM102", # sometimes it's better to nest
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
# Cookiecutter-django entrypoints. The deferred imports are deliberate: they
# run before or during Django's app loading, so they cannot sit at module
# level.
"manage.py" = ["PLC0415", "E501", "TRY003", "EM101"]
# The debugpy block is dev-only tooling, guarded by settings.DEBUG.
"config/asgi.py" = ["T100", "ERA001"]
# Importing signals inside AppConfig.ready() is the documented Django pattern.
"*/apps.py" = ["PLC0415"]
# Tests occasionally import inside a test to keep a patch local to it.
"*/tests/*" = ["PLC0415"]

[tool.ruff.lint.isort]
force-single-line = true
