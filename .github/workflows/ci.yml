name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept in step with compose/local/vite/Dockerfile and requires-python.
  NODE_VERSION: '24.6.0'
  PYTHON_VERSION: '3.13'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python tooling
        run: uv sync --locked

      # pre-commit provisions its own hook environments, including the Node one
      # prettier needs, so nothing else has to be installed here.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opennutrilab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # config/settings/base.py reads this with no default; everything else the
      # test settings need (SECRET_KEY, REDIS_URL) falls back on its own.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/opennutrilab

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci rather than install: it fails when package.json and the lockfile
      # disagree, which is exactly the drift that reached main once already.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Building here covers what unit tests cannot: that every import
      # resolves, the Sass compiles, and the manifest django-vite reads in
      # production is actually produced.
      - name: Build
        run: npm run build
