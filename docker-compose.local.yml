# =========================
# Named volumes for persistence
# =========================
volumes:
  opennutrilab_local_postgres_data: {}
  opennutrilab_local_postgres_data_backups: {}
  opennutrilab_local_redis_data: {}
  opennutrilab_local_django_venv: {} # persistent venv for dev
  opennutrilab_local_vite_node_modules: {} # persistent node_modules (frontend/)
  opennutrilab_pre_commit_cache: {} # persistent pre-commit cache
  opennutrilab_local_claude_config: {} # persistent ~/.claude (Claude Code session history/settings)
  opennutrilab_local_playwright_cache: {} # persistent ~/.cache/ms-playwright (~115 MB of browser binaries)

# =========================
# Services
# =========================
services:
  # -------------------------
  # Django application
  # -------------------------
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: opennutrilab_local_django
    container_name: opennutrilab_local_django
    volumes:
      - opennutrilab_local_django_venv:/app/.venv # persistent virtualenv
      - ./:/app:z # bind project code
      - opennutrilab_pre_commit_cache:/home/dev-user/.cache/pre-commit # persistent pre-commit cache
      - opennutrilab_local_claude_config:/home/dev-user/.claude # persistent Claude Code sessions (survives rebuilds)
      # Without this the Chromium download survives uv sync but not a rebuild,
      # and 115 MB comes back down every time the image changes.
      - opennutrilab_local_playwright_cache:/home/dev-user/.cache/ms-playwright
      # Docker-outside-of-Docker: lets act (installed in the Dockerfile) spin
      # up the GitHub Actions runner containers via the host's own daemon,
      # so local workflow runs are siblings of this container, not nested
      # inside it. Trade-off: this container can now control every container
      # on the host, not just its own.
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    depends_on:
      - postgres
    ports:
      - '8000:8000'
    command: /start

  # -------------------------
  # PostgreSQL
  # -------------------------
  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: opennutrilab_production_postgres
    container_name: opennutrilab_local_postgres
    volumes:
      - opennutrilab_local_postgres_data:/var/lib/postgresql/data
      - opennutrilab_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres

  # -------------------------
  # Redis
  # -------------------------
  redis:
    image: redis:6
    container_name: opennutrilab_local_redis
    volumes:
      - opennutrilab_local_redis_data:/data

  # -------------------------
  # Mail testing
  # -------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: opennutrilab_local_mailpit
    ports:
      - '8025:8025'

  # -------------------------
  # Celery worker
  # -------------------------
  celeryworker:
    <<: *django
    image: opennutrilab_local_celeryworker
    container_name: opennutrilab_local_celeryworker
    # Re-declared without the docker.sock mount: unlike django, this service
    # has no business talking to the host's Docker daemon.
    volumes:
      - opennutrilab_local_django_venv:/app/.venv
      - ./:/app:z
      - opennutrilab_pre_commit_cache:/home/dev-user/.cache/pre-commit
      - opennutrilab_local_claude_config:/home/dev-user/.claude
      - opennutrilab_local_playwright_cache:/home/dev-user/.cache/ms-playwright
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker

  # -------------------------
  # Celery beat
  # -------------------------
  celerybeat:
    <<: *django
    image: opennutrilab_local_celerybeat
    container_name: opennutrilab_local_celerybeat
    # Re-declared without the docker.sock mount: unlike django, this service
    # has no business talking to the host's Docker daemon.
    volumes:
      - opennutrilab_local_django_venv:/app/.venv
      - ./:/app:z
      - opennutrilab_pre_commit_cache:/home/dev-user/.cache/pre-commit
      - opennutrilab_local_claude_config:/home/dev-user/.claude
      - opennutrilab_local_playwright_cache:/home/dev-user/.cache/ms-playwright
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

  # -------------------------
  # Node (frontend)
  # -------------------------
  # -------------------------
  # Vite (React frontend, migration in progress - see frontend/)
  # -------------------------
  vite:
    build:
      context: .
      dockerfile: ./compose/local/vite/Dockerfile
    image: opennutrilab_local_vite
    container_name: opennutrilab_local_vite
    depends_on:
      - django
    volumes:
      - ./frontend:/app:z
      - opennutrilab_local_vite_node_modules:/app/node_modules
    # Same as the node service: the named volume hides whatever the image
    # installed, so dependencies are installed on start instead.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - '5173:5173'
